name: Build

on:
  pull_request:
    paths:
      - 'src/**'
      - 'package.json'
      - 'package-lock.json'
      - 'tsconfig.json'
      - 'webpack.config.js'
      - '.eslintrc'
      - '.github/workflows/build.yml'
  push:
    branches:
      - develop
      - stable

jobs:
  build:
    name: Type check, lint and build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'
          cache: 'npm'

      - name: Install Node dependencies
        run: npm ci

      - name: Check the types
        run: npm run lint:types

      - name: Lint the sources
        run: npm run lint:js

      - name: Build the assets
        run: npm run build
